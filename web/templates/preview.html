<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Dataset — {{ filename }}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #1ca279;
            --primary-dark: #0d5c46;
            --secondary: #5ac596;
            --neutral: #242526;
            --neutral-border: #e4e7eb;
            --body-bg: #f3f4f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--body-bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--neutral);
            letter-spacing: -0.011em;
        }

        .header-card {
            background: #ffffff;
            border: 1px solid var(--neutral-border);
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: 0 2px 10px rgba(36, 37, 38, 0.03);
            margin-bottom: 24px;
        }

        .btn {
            border-radius: 9999px; /* Design system pill button */
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background-color: var(--primary-dark);
            border: 1px solid var(--primary-dark);
            box-shadow: 0 2px 8px rgba(13, 92, 70, 0.2);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #094736;
            border-color: #094736;
            box-shadow: 0 4px 14px rgba(13, 92, 70, 0.32);
            transform: translateY(-1px);
            color: #ffffff;
        }

        .btn-outline-secondary {
            border: 1.5px solid var(--neutral-border);
            color: var(--neutral);
            background: #ffffff;
        }

        .btn-outline-secondary:hover {
            background-color: #f3f4f6;
            border-color: #cbd5e1;
            color: var(--neutral);
        }

        .preview-card {
            background: #ffffff;
            border: 1px solid var(--neutral-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(36, 37, 38, 0.04);
        }

        .table-preview {
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-preview th {
            background-color: var(--neutral);
            color: #f8fafc;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 15px 18px;
            white-space: nowrap;
            border: none;
        }

        .table-preview td {
            font-size: 0.86rem;
            max-width: 340px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 14px 18px;
            border-bottom: 1px solid #f1f3f5;
            color: var(--neutral);
            vertical-align: middle;
        }

        .table-preview tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Custom scrollbar */
        .table-responsive::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .table-responsive::-webkit-scrollbar-track {
            background: #f1f3f5;
        }
        .table-responsive::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container-fluid py-4 px-4 px-md-5">
    <div class="header-card d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
        <div>
            <a href="/dataset" class="btn btn-outline-secondary btn-sm mb-3 rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i>Kembali ke Dataset
            </a>
            <h4 class="fw-bold text-dark mb-1">
                <i class="bi bi-table me-2" style="color: var(--primary);"></i>Preview Dataset: <span style="color: var(--primary-dark);">{{ filename }}</span>
            </h4>
            <p class="text-muted small mb-0">Menampilkan {{ total_preview }} baris pertama dari file dataset.</p>
        </div>
        <div>
            <a href="/download/{{ filename }}" class="btn btn-primary btn-sm px-4 py-2 rounded-pill">
                <i class="bi bi-download me-1"></i>Download Full File
            </a>
        </div>
    </div>

    <div class="card preview-card border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-preview mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">#</th>
                            {% for col in columns %}
                                <th>{{ col }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in rows %}
                        <tr>
                            <td class="ps-4 text-center fw-bold text-muted" style="width: 50px;">{{ loop.index }}</td>
                            {% for col in columns %}
                                <td title="{{ row[col] }}">{{ row[col] }}</td>
                            {% endfor %}
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
