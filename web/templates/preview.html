<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Dataset — {{ filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-preview th { background-color: #1b365d; color: white; white-space: nowrap; }
        .table-preview td { font-size: 13px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <a href="/" class="btn btn-outline-secondary btn-sm mb-2"><i class="bi bi-arrow-left me-1"></i>Kembali ke Dashboard</a>
            <h4 class="fw-bold text-dark mb-0"><i class="bi bi-table me-2 text-primary"></i>Preview Dataset: <span class="text-primary">{{ filename }}</span></h4>
            <p class="text-muted small mb-0">Menampilkan {{ total_preview }} baris pertama dari file dataset.</p>
        </div>
        <div>
            <a href="/download/{{ filename }}" class="btn btn-primary btn-sm"><i class="bi bi-download me-1"></i>Download Full File</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover table-preview mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            {% for col in columns %}
                                <th>{{ col }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in rows %}
                        <tr>
                            <td class="text-center fw-bold text-muted">{{ loop.index }}</td>
                            {% for col in columns %}
                                <td title="{{ row[col] }}">{{ row[col] }}</td>
                            {% endfor %}
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
