{% extends "base.html" %}

{% block title %}Scraper Berita Valid — HoaxCheck Studio{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-1">Scraper Berita Valid</h4>
    </div>
</div>

<div class="row g-4">
    <div class="col-lg-8">
        <div class="card-clean">
            <div class="card-header-clean d-flex align-items-center gap-2">
                <i class="bi bi-cloud-arrow-down text-primary"></i>
                <span>Tarik Berita Real-Time (Antara, CNN, CNBC)</span>
            </div>
            <div class="card-body p-4">
                <form action="/scrape" method="POST">
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label small fw-semibold">Pilih Sumber Berita:</label>
                            <select name="source" class="form-select">
                                <option value="all">Semua Portal (Antara, CNN, CNBC) — Rekomendasi</option>
                                <option value="antara">Antara News (Resmi Kantor Berita Negara)</option>
                                <option value="cnn">CNN Indonesia (Nasional, Tekno, Ekonomi)</option>
                                <option value="cnbc">CNBC Indonesia (News, Tech, Market)</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold">Target Jumlah Berita:</label>
                            <select name="limit" class="form-select">
                                <option value="100">100 Artikel (~1 detik)</option>
                                <option value="200" selected>200 Artikel (~2 detik)</option>
                                <option value="500">500 Artikel (~4 detik)</option>
                                <option value="all">Semua Tersedia (~750)</option>
                            </select>
                        </div>
                        <div class="col-12 pt-2">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-play-circle me-1"></i> Mulai Scraping Sekarang
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
