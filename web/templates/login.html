<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator — HoaxCheck Studio</title>
    <!-- Fonts: Design System Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --primary: #006c4e;
            --primary-base: #1ca379;
            --primary-dark: #00513a;
            --primary-subtle: #e6f8f0;
            --primary-border: #82f8c8;
            --neutral-darkest: #1b1c1d;
            --neutral-dark: #242526;
            --neutral-border: #e3e2e3;
        }

        body {
            background-color: #1b1c1d;
            background-image: 
                radial-gradient(at 0% 0%, rgba(28, 163, 121, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 108, 78, 0.2) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-family);
            padding: 24px;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            border-bottom: 1px solid var(--neutral-border);
            padding: 32px 24px 24px 24px;
            text-align: center;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #006c4e 0%, #1ca379 100%);
            color: #ffffff;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 14px;
            box-shadow: 0 6px 18px rgba(0, 108, 78, 0.35);
        }

        .form-control:focus {
            border-color: #1ca379;
            box-shadow: 0 0 0 4px rgba(28, 163, 121, 0.15);
        }

        .btn-ds-primary {
            background: #006c4e;
            border-color: #006c4e;
            color: #ffffff;
            border-radius: 9999px;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 0.92rem;
            box-shadow: 0 4px 14px rgba(0, 108, 78, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            border: none;
        }

        .btn-ds-primary:hover {
            background: #00513a;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 108, 78, 0.4);
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-icon">
            <i class="bi bi-shield-check"></i>
        </div>
        <h4 class="fw-bold mb-1" style="color: var(--neutral-darkest); letter-spacing: -0.02em;">HoaxCheck Studio</h4>
        <p class="text-muted small mb-0">Masuk untuk mengelola dataset & model ML</p>
    </div>

    <div class="p-4">
        <!-- Flash message -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show border-0 py-2 px-3 small mb-3" style="border-radius: 10px;" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i>{{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Masukkan username" value="admin" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Masukkan password" value="admin" required>
                </div>
            </div>

            <div class="p-2 mb-3 rounded-3 text-muted border" style="font-size: 11px; background: #e6f8f0; border-color: #82f8c8 !important;">
                <i class="bi bi-shield-lock-fill me-1" style="color: #006c4e;"></i>Kredensial Default Admin: <strong>admin</strong> / <strong>admin</strong>
            </div>

            <button type="submit" class="btn-ds-primary py-2 mt-2">
                <i class="bi bi-box-arrow-in-right"></i> Masuk Sekarang
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
